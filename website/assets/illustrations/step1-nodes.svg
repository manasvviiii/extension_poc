<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="nGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Node Connection Web -->
  <g stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="50" y1="50" x2="120" y2="30" />
    <line x1="120" y1="30" x2="190" y2="60" />
    <line x1="50" y1="50" x2="90" y2="120" />
    <line x1="90" y1="120" x2="190" y2="60" />
    <line x1="120" y1="30" x2="140" y2="110" />
    <line x1="140" y1="110" x2="190" y2="60" />
  </g>

  <!-- Glowing Nodes -->
  <circle cx="50" cy="50" r="12" fill="#0b1224" stroke="url(#nGrad1)" stroke-width="2.5" filter="url(#nodeGlow)"/>
  <circle cx="50" cy="50" r="5" fill="#38bdf8" />

  <circle cx="120" cy="30" r="10" fill="#0b1224" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="120" cy="30" r="4" fill="#8b5cf6" />

  <circle cx="190" cy="60" r="14" fill="#0b1224" stroke="url(#nGrad1)" stroke-width="3" filter="url(#nodeGlow)"/>
  <circle cx="190" cy="60" r="6" fill="#ec4899" />

  <circle cx="90" cy="120" r="9" fill="#0b1224" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="90" cy="120" r="4" fill="#38bdf8" />

  <circle cx="140" cy="110" r="11" fill="#0b1224" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="140" cy="110" r="5" fill="#8b5cf6" />
</svg>
