<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Hub — WarmGraph Documentation & Journal</title>
  <meta name="description" content="Technical documentation, research notes, graph theory algorithms, and investment banking workflow guides for WarmGraph.">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/knowledge.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Header / Navigation -->
  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="logo-link">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24">
            <circle cx="6" cy="6" r="3" />
            <circle cx="18" cy="6" r="3" />
            <circle cx="12" cy="18" r="3" />
            <path d="M8.5 7.5L15.5 7.5 M7.5 8.5L10.5 15.5 M16.5 8.5L13.5 15.5" stroke="currentColor" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text">Warm<span>Graph</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="index.html#how-it-works" class="nav-link">How It Works</a></li>
        <li><a href="knowledge.html" class="nav-link active">Knowledge Hub</a></li>
        <li><a href="roadmap.html" class="nav-link">Roadmap</a></li>
        <li><a href="network.html" class="nav-link">My Network</a></li>
      </ul>

      <div style="display: flex; align-items: center; gap: 16px;">
        <button class="nav-cta-btn open-install-modal">
          <span>Get Extension</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <button class="mobile-toggle" aria-label="Toggle Navigation Menu">☰</button>
      </div>
    </div>
  </header>

  <!-- Knowledge Hub Layout -->
  <div class="container knowledge-layout">
    <!-- Left Sticky Sidebar -->
    <aside class="knowledge-sidebar">
      <div class="search-box-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="knowledge-search" class="search-input" placeholder="Search documentation...">
      </div>

      <div>
        <div class="category-nav-title">DOCUMENTATION ARTICLES</div>
        <ul id="category-list" class="category-list">
          <!-- Dynamic sidebar category items -->
        </ul>
      </div>
    </aside>

    <!-- Main Article Display Area -->
    <main class="doc-article-container">
      <div class="doc-article-header">
        <h1 id="doc-article-title" class="doc-article-title">WarmGraph High-Level Architecture</h1>
        <div id="doc-article-meta" class="doc-article-meta">
          <span class="hub-tag">ARCHITECTURE</span> • <span>6 min read</span>
        </div>
      </div>

      <div id="doc-article-body" class="doc-body">
        <p style="color: var(--text-muted);">Loading documentation content...</p>
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; 2026 WarmGraph Inc. Knowledge Hub Documentation.</span>
        <a href="index.html" style="color: var(--primary-blue); text-decoration: none;">← Back to Main Website</a>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/knowledge.js"></script>
</body>
</html>
